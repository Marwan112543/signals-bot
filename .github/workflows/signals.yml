name: Trading Signals

on:
  schedule:
    - cron: "*/30 * * * *"     # يضمن وجود تشغيل منتظر دائماً يبدأ فور انتهاء الحالي
  workflow_dispatch:           # تشغيل يدوي من صفحة Actions
    inputs:
      mode:
        description: "loop = تشغيل مستمر | test = رسالة تجربة | run = فحص واحد"
        default: "test"
        type: choice
        options: [test, loop, run]

permissions:
  contents: write              # لحفظ ملف state.json (الإشارات المُرسلة) حتى لا تتكرر

concurrency:
  group: signals-${{ github.event.inputs.mode || 'loop' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # أحدث نسخة (فيها آخر state.json)

      - name: Run bot
        run: |
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -u bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'loop' }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase -X theirs || true
            git push || true
          fi
