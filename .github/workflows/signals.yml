name: Trading Signals

on:
  schedule:
    - cron: "7 * * * *"        # احتياطي فقط (GitHub يؤخره كثيراً) — التشغيل الأساسي من cron-job.org عند إغلاق كل شمعة
  workflow_dispatch:           # يُستدعى من cron-job.org، أو يدوياً من صفحة Actions
    inputs:
      mode:
        description: "run = فحص عادي | test = رسالة تجربة بآخر إشارة لكل عملة"
        default: "run"
        type: choice
        options: [test, run]

permissions:
  contents: write              # لحفظ ملف state.json (الإشارات المُرسلة) حتى لا تتكرر

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        run: python3 bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode || 'run' }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signals-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
